name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: pnpm pack --dry-run

  runtime-node-20:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v5.0.0

      - name: Set up the Node 24 build toolchain
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Switch to the minimum supported Node runtime
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Test compiled output on Node 20
        run: node node_modules/vitest/vitest.mjs run
